
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff9df">
  <title>佳原ゆわの歌リクエスト</title>

   <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxhuogV_zttjvWFerfiyLTSN0IOryHBo3vLPv-4pXrp9RBiFspcy6IoTDABra_-RdCZAg/exec';
   </script>

  
　<link rel="preconnect" href="https://fonts.googleapis.com">
　<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
　<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #ffe66d;
      --yellow-light: #fff9df;
      --pink: #ffe8ee;
      --brown: #554637;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Zen Maru Gothic", sans-serif;
      color: var(--brown);
      background: var(--yellow-light);
      line-height: 1.7;
    }

    
　　header {
  　　position: relative;
  　　overflow: hidden;
  　　padding: 42px 20px 38px;
  　　text-align: center;
  　　background: linear-gradient(135deg, #ffe66d 0%, #fff0a8 100%);
 　　 border-radius: 0 0 36px 36px;
  　　box-shadow: 0 5px 18px #b58b0018;
　　}

　　header h1 {
  　　margin: 0;
 　　 font-size: clamp(25px, 5vw, 36px);
  　　font-weight: 700;
 　　 letter-spacing: 0.04em;
 　　 text-shadow: 0 2px 0 #ffffff80;
    　display: block;
  　　text-align: center;
　　}

　　header p {
 　　 margin: 10px 0 0;
 　　 font-size: 14px;
　　  font-weight: 500;
　　}


    main {
      width: min(100% - 32px, 720px);
      margin: 28px auto;
    }

    section {
      margin-bottom: 24px;
      padding: 22px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 4px 14px #5546370d;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    footer {
      padding: 24px;
      text-align: center;
      font-size: 13px;
    }

    
/* 検索フォーム */
#song-list label {
  display: block;
  margin: 16px 0 6px;
  font-size: 14px;
  font-weight: bold;
}

#song-search,
#genre-filter {
  display: block;
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid #eadfca;
  border-radius: 12px;
  background: #fffdf6;
  color: var(--brown);
  font: inherit;
}

#song-search:focus,
#genre-filter:focus {
  outline: 2px solid #f0ce45;
  outline-offset: 2px;
}

#search-button {
  display: block;
  width: 100%;
  min-height: 48px;
  margin-top: 18px;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: var(--yellow);
  color: var(--brown);
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

#search-button:hover {
  filter: brightness(0.97);
}

#search-button:active {
  transform: scale(0.99);
}

#song-count {
  margin-top: 20px;
  font-size: 14px;
  font-weight: bold;
}

#song-results article h3 {
  margin: 0;
  font-size: 17px;
}

#song-results article p {
  margin: 4px 0;
  font-size: 14px;
}

  </style>
</head>

<body>
  <header>
    <h1>🎤 佳原ゆわの歌リクエスト 🎶</h1>
    <p>歌える曲を検索！一覧にない曲もリクエストしてね♪</p>
  </header>

  <main>

　<section id="song-list">
  <h2>🎵 歌える曲を探す</h2>
  <p>曲名やアーティスト名から検索できるよ！</p>

  
<label for="song-search">曲名・アーティスト名</label>
<input
  id="song-search"
  type="search"
  placeholder="曲名やアーティスト名を入力"
>

<label for="genre-filter">ジャンル</label>

  <select id="genre-filter">
    <option value="">すべてのジャンル</option>
    <option value="J-POP">J-POP</option>
    <option value="アニソン">アニソン</option>
    <option value="ボカロ">ボカロ</option>
    <option value="アイドル">アイドル</option>
    <option value="ロック">ロック</option>
    <option value="バラード">バラード</option>
    <option value="洋楽">洋楽</option>
    <option value="その他">その他</option>
  </select>

  
　<button id="search-button" type="button">🔍 検索する</button>

  <p id="song-count" aria-live="polite">曲データを準備中...</p>
  <div id="song-results" aria-live="polite">
    <p>曲一覧を読み込む準備中だよ♪</p>
  </div>
　</section>


    <section id="song-request">
      <h2>💌 曲のリクエスト</h2>
      <p>一覧にない曲も、ぜひ教えてね！</p>
      <p>リクエストフォームはこれから追加するよ。</p>
    </section>
  </main>

  <footer>
    © 佳原ゆわの歌リクエスト
  </footer>

  
　<script>
  (function () {
    const searchInput = document.getElementById('song-search');
    const genreFilter = document.getElementById('genre-filter');
    const songCount = document.getElementById('song-count');
    const songResults = document.getElementById('song-results');

    let songs = [];

    function loadSongs() {
      const callbackName =
        'yuwasongCallback_' + Date.now();

      const script = document.createElement('script');
      const separator = GAS_API_URL.includes('?') ? '&' : '?';

      window[callbackName] = function (data) {
        delete window[callbackName];
        script.remove();

        if (!data || !data.success || !Array.isArray(data.songs)) {
          songCount.textContent = '曲データを読み込めなかったよ。';
          return;
        }

        songs = data.songs;
        renderSongs();
      };

      script.onerror = function () {
        delete window[callbackName];
        script.remove();
        songCount.textContent =
          '曲データの読み込みに失敗したよ。時間をおいて再度確認してね。';
      };

      script.src = GAS_API_URL
        + separator
        + 'callback='
        + encodeURIComponent(callbackName);

      document.head.appendChild(script);
    }

    function renderSongs() {
      const keyword = searchInput.value.trim().toLowerCase();
      const selectedGenre = genreFilter.value;

      const filteredSongs = songs.filter(function (song) {
        const title = String(song.title || '');
        const artist = String(song.artist || '');

        const matchesKeyword =
          title.toLowerCase().includes(keyword)
          || artist.toLowerCase().includes(keyword);

        const genres = String(song.genre || '')
          .split(',')
          .map(function (genre) {
            return genre.trim();
          });

        const matchesGenre =
          !selectedGenre || genres.includes(selectedGenre);

        return matchesKeyword && matchesGenre;
      });

      songCount.textContent =
        '全 ' + filteredSongs.length + ' 曲';

      songResults.replaceChildren();

      if (filteredSongs.length === 0) {
        const emptyMessage = document.createElement('p');
        emptyMessage.textContent =
          '該当する曲が見つからなかったよ。';
        songResults.appendChild(emptyMessage);
        return;
      }

      filteredSongs.forEach(function (song) {
        const card = document.createElement('article');
        const title = document.createElement('h3');
        const artist = document.createElement('p');
        const genre = document.createElement('p');

        title.textContent = song.title || '曲名未登録';
        artist.textContent = song.artist || 'アーティスト未登録';
        genre.textContent = String(song.genre || '')
          .split(',')
          .map(function (item) {
            return item.trim();
          })
          .filter(Boolean)
          .join(' / ');

        card.append(title, artist, genre);
        card.style.padding = '12px 0';
        card.style.borderBottom = '1px solid #eee4c8';

        songResults.appendChild(card);
      });
    }

    searchInput.addEventListener('input', renderSongs);
    genreFilter.addEventListener('change', renderSongs);

    loadSongs();
  })();
　</script>

</body>
</html>
