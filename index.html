      --brown: #554637;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

      margin: 0;
      font-family: sans-serif;
      color: var(--brown);
      background: var(--yellow-light);
      line-height: 1.7;

      padding: 36px 20px;
      text-align: center;
      background: var(--yellow);
      border-radius: 0 0 32px 32px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 36px);
    }

    header p {
      margin: 8px 0 0;
    }

      margin: 28px auto;
    }

    section {
