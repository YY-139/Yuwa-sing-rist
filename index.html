<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff9df">
  <title>佳原ゆわの歌リクエスト</title>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxhuogV_zttjvWFerfiyLTSN0IOryHBo3vLPv-4pXrp9RBiFspcy6IoTDABra_-RdCZAg/exec';
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #ffe66d;
      --yellow-light: #fff9df;
      --pink: #ffe8ee;
      --brown: #554637;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Zen Maru Gothic", sans-serif;
      color: var(--brown);
      background: var(--yellow-light);
      line-height: 1.7;
    }

    /* ヘッダー */
    header {
      width: 100%;
      padding: 38px 20px 34px;
      text-align: center;
      background: linear-gradient(135deg, #ffe66d 0%, #fff0a8 100%);
      border-radius: 0 0 32px 32px;
      box-shadow: 0 5px 18px #b58b0018;
    }

    header h1 {
      display: block;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      font-size: clamp(23px, 5vw, 34px);
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: 0.02em;
      overflow-wrap: anywhere;
    }

    header p {
      margin: 10px auto 0;
      max-width: 520px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    /* メイン */
    main {
      width: min(100% - 32px, 720px);
      margin: 28px auto;
    }

    section {
      margin-bottom: 24px;
      padding: 22px;
      background: var(--white);
      border: 1px solid #f4edda;
      border-radius: 24px;
      box-shadow: 0 5px 18px #5546370b;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 700;
    }

    h3 {
      font-weight: 700;
    }

    p {
      overflow-wrap: anywhere;
    }

    /* 画面切り替えボタン */
    .page-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .tab-button {
      min-height: 58px;
      padding: 10px;
      border: 2px solid #f0dfaa;
      border-radius: 16px;
      background: #ffffff;
      color: var(--brown);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .tab-button:hover {
      background: #fff4c6;
      transform: translateY(-2px);
    }

    .tab-button[aria-pressed="true"] {
      background: var(--yellow);
      border-color: #f0ce45;
    }

    .tab-button span {
      display: block;
      font-size: 12px;
      font-weight: 500;
    }

    /* 検索フォーム */
    #song-list label {
      display: block;
      margin: 16px 0 6px;
      font-size: 14px;
      font-weight: 700;
    }

    #song-search,
    #genre-filter {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #eadfca;
      border-radius: 12px;
      background: #fffdf6;
      color: var(--brown);
      font: inherit;
    }

    #song-search:focus,
    #genre-filter:focus {
      outline: 2px solid #f0ce45;
      outline-offset: 2px;
    }

    #search-button {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: var(--yellow);
      color: var(--brown);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 #e8c943;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    #search-button:hover {
      filter: brightness(0.98);
    }

    #search-button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #e8c943;
    }

    #song-count {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 700;
    }

  
    /* 曲カード：1曲ずつ見分けやすくする */
    #song-results article,
    #list-results article {
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #eadbb8;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 3px 10px #5546370a;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #song-results article:last-child,
    #list-results article:last-child {
      margin-bottom: 0;
    }

    #song-results article:hover,
    #list-results article:hover {
      border-color: #e8ce70;
      box-shadow: 0 4px 14px #b58b0014;
    }

    #song-results article h3,
    #list-results article h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #song-results article p,
    #list-results article p {
      margin: 5px 0 0;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .song-artist {
      color: #786a58;
    }

    .song-genre {
      color: #a17d16;
      font-size: 12px !important;
    }

    .helper-text {
      color: #786a58;
      font-size: 13px;
    }

    /* 画面の表示切り替え */
    [hidden] {
      display: none !important;
    }

    /* リクエスト欄 */
    #song-request {
      border-radius: 24px;
      background: #ffffff;
    }

    .request-decoration {
      color: #b58b00;
      text-align: center;
      font-size: 14px;
    }

    /* フッター */
    footer {
      padding: 24px 16px;
      text-align: center;
      font-size: 13px;
      color: #786a58;
    }

    @media (max-width: 480px) {
      header {
        padding: 30px 14px 28px;
      }

      header h1 {
        font-size: 23px;
      }

      main {
        width: min(100% - 24px, 720px);
        margin-top: 20px;
      }

      section {
        padding: 18px;
        border-radius: 20px;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🎤 佳原ゆわの歌リクエスト 🎶</h1>
    <p>歌いたい曲、見つけてね ♪</p>
  </header>

  <main>
    <nav class="page-tabs" aria-label="曲の探し方">
      <button
        class="tab-button"
        id="search-tab"
        type="button"
        aria-pressed="true"
      >
        🔍 検索から調べる
        <span>曲名・ジャンルで探す</span>
      </button>

      <button
        class="tab-button"
        id="list-tab"
        type="button"
        aria-pressed="false"
      >
        🎵 一覧から調べる
        <span>歌える曲を眺める</span>
      </button>
    </nav>

    <section id="search-page">
      <h2>🔍 曲を検索する</h2>
      <p>曲名やアーティスト名から探してね！</p>

      <label for="song-search">曲名・アーティスト名</label>
      <input
        id="song-search"
        type="search"
        maxlength="100"
        placeholder="曲名やアーティスト名を入力"
      >

      <label for="genre-filter">ジャンル</label>
      <select id="genre-filter">
        <option value="">すべてのジャンル</option>
        <option value="J-POP">J-POP</option>
        <option value="アニソン">アニソン</option>
        <option value="ボカロ">ボカロ</option>
        <option value="アイドル">アイドル</option>
        <option value="ロック">ロック</option>
        <option value="バラード">バラード</option>
        <option value="洋楽">洋楽</option>
        <option value="その他">その他</option>
      </select>

      <button id="search-button" type="button">🔍 この条件で検索</button>

      <p id="song-count" aria-live="polite">曲データを読み込み中...</p>
      <div id="song-results" aria-live="polite">
        <p>曲一覧を読み込む準備中だよ♪</p>
      </div>
    </section>

    <section id="list-page" hidden>
      <h2>🎵 歌える曲一覧</h2>
      <p>気になる曲を探してみてね！</p>
      <p class="helper-text">曲名・アーティスト名・ジャンルを表示しているよ。</p>
      <p id="list-count" aria-live="polite">曲データを読み込み中...</p>
      <div id="list-results" aria-live="polite"></div>
    </section>

    
  <section id="song-request">
  <h2>💌 曲のリクエスト</h2>
  <p>一覧にない曲も、ぜひ教えてね！</p>

  <form id="request-form">
    <div class="form-group">
      <label for="request-title">曲名 <span>必須</span></label>
      <input
        type="text"
        id="request-title"
        name="requestedTitle"
        maxlength="100"
        placeholder="リクエストしたい曲名"
        required
      >
    </div>

    <div class="form-group">
      <label for="request-artist">アーティスト名</label>
      <input
        type="text"
        id="request-artist"
        name="requestedArtist"
        maxlength="100"
        placeholder="アーティスト名（任意）"
      >
    </div>

    <div class="form-group">
      <label for="request-listener">お名前・ニックネーム</label>
      <input
        type="text"
        id="request-listener"
        name="listenerName"
        maxlength="50"
        placeholder="お名前（任意）"
      >
    </div>

    <div class="form-group">
      <label for="request-message">ひとこと</label>
      <textarea
        id="request-message"
        name="message"
        maxlength="300"
        rows="3"
        placeholder="曲への思いなど、自由に書いてね♪"
      ></textarea>
    </div>

    <button type="submit" id="request-submit">
      リクエストを送る ♡
    </button>

    <p id="request-status" role="status" aria-live="polite"></p>
  </form>

  <iframe
    name="request-response-frame"
    id="request-response-frame"
    title="リクエスト送信結果"
    hidden
  ></iframe>

  <p class="request-decoration">♡ あなたのリクエスト待ってます ♡</p>
  </section>

  </main>

  <footer>
    ♡ © 佳原ゆわの歌リクエスト ♡
  </footer>

  <script>
    (function () {
      const searchInput = document.getElementById('song-search');
      const genreFilter = document.getElementById('genre-filter');
      const searchButton = document.getElementById('search-button');
      const songCount = document.getElementById('song-count');
      const songResults = document.getElementById('song-results');
      const listCount = document.getElementById('list-count');
      const listResults = document.getElementById('list-results');

      const searchTab = document.getElementById('search-tab');
      const listTab = document.getElementById('list-tab');
      const searchPage = document.getElementById('search-page');
      const listPage = document.getElementById('list-page');

      let songs = [];

      function switchPage(page) {
        const showSearch = page === 'search';

        searchPage.hidden = !showSearch;
        listPage.hidden = showSearch;

        searchTab.setAttribute('aria-pressed', String(showSearch));
        listTab.setAttribute('aria-pressed', String(!showSearch));

        if (!showSearch) {
          renderList();
        }
      }

      function loadSongs() {
        const callbackName = 'yuwasongCallback_' + Date.now();
        const script = document.createElement('script');
        const separator = GAS_API_URL.includes('?') ? '&' : '?';

        window[callbackName] = function (data) {
          delete window[callbackName];
          script.remove();

          if (!data || !data.success || !Array.isArray(data.songs)) {
            showLoadError();
            return;
          }

          songs = data.songs;
          renderSearchResults();
          renderList();
        };

        script.onerror = function () {
          delete window[callbackName];
          script.remove();
          showLoadError();
        };

        script.src = GAS_API_URL
          + separator
          + 'callback='
          + encodeURIComponent(callbackName);

        document.head.appendChild(script);
      }

      function showLoadError() {
        songCount.textContent = '曲データを読み込めなかったよ。';
        songResults.replaceChildren();

        const message = document.createElement('p');
        message.textContent = '時間をおいて、もう一度確認してね。';
        songResults.appendChild(message);

        listCount.textContent = '曲データを読み込めなかったよ。';
        listResults.replaceChildren();
      }

            // ひらがな・カタカナ、全角・半角、大文字・小文字の違いを吸収する
      function normalizeForSearch(value) {
        return String(value || '')
          .normalize('NFKC')
          .toLowerCase()
          .replace(/[ァ-ヶ]/g, function (character) {
            return String.fromCharCode(character.charCodeAt(0) - 0x60);
          })
          .trim();
      }

      
      function filterSongs() {
        const keyword = normalizeForSearch(searchInput.value);
        const selectedGenre = normalizeForSearch(genreFilter.value);

        return songs.filter(function (song) {
          const title = normalizeForSearch(song.title);
          const artist = normalizeForSearch(song.artist);
          const genreText = normalizeForSearch(song.genre);
          const searchWords = normalizeForSearch(song.searchWords)
                .split(/[、,，\s]+/)
                .filter(Boolean);

          const matchesKeyword =
            !keyword
            || title.includes(keyword)
            || artist.includes(keyword)
            || genreText.includes(keyword)
            || searchWords.some(function (word) {
               return word.includes(keyword);
               });

          const genres = String(song.genre || '')
            .split(',')
            .map(function (genre) {
              return normalizeForSearch(genre);
            });

          const matchesGenre =
            !selectedGenre || genres.includes(selectedGenre);

          return matchesKeyword && matchesGenre;
        });
      }

      function createSongCard(song) {
        const card = document.createElement('article');
        const title = document.createElement('h3');
        const artist = document.createElement('p');
        const genre = document.createElement('p');

        title.textContent = song.title || '曲名未登録';
        artist.textContent = song.artist || 'アーティスト未登録';
        artist.className = 'song-artist';

        genre.textContent = String(song.genre || '')
          .split(',')
          .map(function (item) {
            return item.trim();
          })
          .filter(Boolean)
          .join(' ♡ ');

        genre.className = 'song-genre';

        card.append(title, artist, genre);
        return card;
      }

      function renderSearchResults() {
        const filteredSongs = filterSongs();

        songCount.textContent = '検索結果：' + filteredSongs.length + ' 曲';
        songResults.replaceChildren();

        if (filteredSongs.length === 0) {
          const message = document.createElement('p');
          message.textContent = '該当する曲が見つからなかったよ。';
          songResults.appendChild(message);
          return;
        }

        filteredSongs.forEach(function (song) {
          songResults.appendChild(createSongCard(song));
        });
      }

      function renderList() {
        listCount.textContent = '全 ' + songs.length + ' 曲';
        listResults.replaceChildren();

        if (songs.length === 0) {
          const message = document.createElement('p');
          message.textContent = 'まだ曲が登録されていないよ。';
          listResults.appendChild(message);
          return;
        }

        songs.forEach(function (song) {
          listResults.appendChild(createSongCard(song));
        });
      }

      searchButton.addEventListener('click', renderSearchResults);
      searchTab.addEventListener('click', function () {
        switchPage('search');
      });
      listTab.addEventListener('click', function () {
        switchPage('list');
      });

      loadSongs();
    })();
  </script>
</body>
</html>
